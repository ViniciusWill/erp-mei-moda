<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../static/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../static/favicon.ico" type="image/x-icon">
    <title>Login</title>
    <style>
        :root {
            --color-bg: #f7f3f7;
            --color-surface: #fffdfd;
            --color-surface-soft: #f2ebf1;
            --color-border: #c9b8c5;
            --color-border-strong: #7d6678;
            --color-text: #2f2430;
            --color-text-soft: #6e6170;
            --color-header: #3a2f3f;
            --color-header-strong: #2d2331;
            --color-brand: #9a6b88;
            --color-brand-strong: #7e536d;
            --color-brand-soft: #ead8e4;
            --color-info: #6a8fb8;
            --color-info-strong: #446d96;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--color-text);
            background:
                radial-gradient(circle at top, rgba(154, 107, 136, 0.18), transparent 32%),
                linear-gradient(180deg, #faf7fa 0%, var(--color-bg) 100%);
        }

        .login-card {
            width: min(420px, calc(100vw - 32px));
            padding: 30px 24px 24px;
            border: 1px solid var(--color-border);
            border-radius: 16px;
            background: var(--color-surface);
            box-shadow: 0 16px 40px rgba(58, 47, 63, 0.12);
            text-align: center;
        }

        .logo-shell {
            width: 96px;
            height: 96px;
            margin: 0 auto 14px;
            border-radius: 24px;
            background: linear-gradient(180deg, var(--color-brand-soft), #f7eef4);
            border: 1px solid rgba(125, 102, 120, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.65rem;
            color: var(--color-header-strong);
        }

        .subtitulo {
            margin: 0 0 22px;
            color: var(--color-text-soft);
            font-size: 0.95rem;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 14px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-surface-soft);
            color: var(--color-text);
        }

        input:focus {
            outline: 2px solid rgba(106, 143, 184, 0.18);
            border-color: var(--color-info);
        }

        .acoes {
            display: grid;
            gap: 10px;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
        }

        .btn-primario {
            border: 1px solid var(--color-brand-strong);
            background-color: var(--color-brand);
            color: #fff;
        }

        .btn-primario:hover {
            background-color: var(--color-brand-strong);
        }

        .btn-secundario {
            border: 1px solid var(--color-info);
            background-color: transparent;
            color: var(--color-info-strong);
        }

        .btn-secundario:hover {
            background-color: var(--color-info);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-shell">
            <img class="logo-img" src="../static/imagens/logo.ico" alt="Logo">
        </div>
        <h1>Login</h1>
        <p class="subtitulo">Acesse o ERP com suas credenciais.</p>

        <form method="POST" action="/login">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>

            <div class="acoes">
                <button type="submit" class="btn-primario">Entrar</button>
                <button type="submit" class="btn-secundario" formaction="/EsqueciSenha">Esqueci a Senha</button>
            </div>
        </form>
    </div>
</body>
</html>
